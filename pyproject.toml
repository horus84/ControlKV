[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "controlkv"
version = "0.1.0"
description = "Evaluation study of KV-Cache quantization impact on structured tool decisions"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Anonymous ACL ARR Submission", email = "anonymous@example.com" }
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.46.0",
    "optimum>=1.16.0",
    "optimum-quanto>=0.2.0",
    "datasets>=2.14.0",
    "accelerate>=0.26.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["controlkv*"]

[tool.pyright]
pythonPath = "C:\\Users\\linseed21\\anaconda3\\python.exe"
venvPath = "C:\\Users\\linseed21\\anaconda3"
extraPaths = [
    "C:\\Users\\linseed21\\anaconda3\\Lib\\site-packages",
    "c:\\Users\\linseed21\\Desktop\\ControlKV"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "."
]
